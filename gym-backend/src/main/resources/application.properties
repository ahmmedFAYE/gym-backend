spring.application.name=gym-backend
# -----------------------------------------------------------------
# 1. CONNEXION À POSTGRESQL
# -----------------------------------------------------------------
#L'url de la DB:
spring.datasource.url = jdbc:postgresql://localhost:5432/gym_db
#Infos de la DB
spring.datasource.username = postgres
spring.datasource.password = CHANGE_ME
#Classe du DRIVER JDBC
spring.datasource.driver-class-name = org.postgresql.Driver



# -----------------------------------------------------------------
# 2. CONFIGURATION DE JPA / HIBERNATE
# -----------------------------------------------------------------
# "update" demande à Hibernate de comparer nos classes @Entity avec la BDD.
# S'il ne trouve pas la table "members", il la crée automatiquement !
spring.jpa.hibernate.ddl-auto = update


# -----------------------------------------------------------------
# 3. CONSOLE & DEBUG
# -----------------------------------------------------------------
# Affiche dans la console IntelliJ toutes les requêtes SQL générées par Spring
spring.java.show-sql = true

# Formate le code SQL dans la console pour qu'il soit bien lisible et aéré
spring.java.properties.hibernate.format_sql =true